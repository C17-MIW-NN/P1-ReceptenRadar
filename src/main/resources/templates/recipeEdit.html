<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head th:replace="fragments/general :: baseheader(~{::title})">

    <title>ReceptenRadar | Pas recept aan</title>

</head>

<body>

<div th:replace="~{fragments/general :: navbar}"></div>

<div class="container">
    <form th:action="@{/recipe/save}" th:object="${recipe}" method="post">
        <input type="hidden" th:field="*{recipeId}" />

        <label for="recipeName">Naam van recept:</label>
        <input type="text" th:field="*{recipeName}" id="recipeName" />

        <label for="preparationTime">Bereidingstijd (in minuten):</label>
        <input type="number" th:field="*{preparationTime}" id="preparationTime" />

        <label for="forAmountOfPeople">Aantal personen:</label>
        <input type="number" th:field="*{forAmountOfPeople}" id="forAmountOfPeople" />

        <label for="calories">Calorieën:</label>
        <input type="number" th:field="*{calories}" id="calories" />

        <label for="imageUrl">Afbeeldings-URL:</label>
        <input type="text" th:field="*{imageUrl}" id="imageUrl" />

        <label for="categories">Categorieën:</label>
        <select th:field="*{categories}" multiple id="categories">
            <option th:each="categorie : ${allCategories}"
                    th:value="${categorie.categoryId}"
                    th:text="${categorie.categoryName}">
            </option>
        </select>

        <button type="submit">Opslaan</button>
    </form>

</div>

<div th:replace="~{fragments/general :: footer}"></div>
<div th:replace="~{fragments/general :: bottomScripts}"></div>

</body>


</html>
