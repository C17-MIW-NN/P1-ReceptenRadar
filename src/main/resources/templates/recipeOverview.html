<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recipes</title>
</head>
<body>
    <h1>Overview of all recipes</h1>

    <table>
        <th>
            <td>Recipe name</td>
        </th>
        <tr th:each="recipe : ${allRecipes}">
            <td th:text="${recipe.recipeName}"></td>
        </tr>
    </table>

    <a th:href="@{/recipe/add}">Add a new Recipe</a>


</body>
</html>
