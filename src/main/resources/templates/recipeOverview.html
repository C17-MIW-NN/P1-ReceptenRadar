<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

    <head th:replace="~{fragments/general :: baseheader(~{:: title})}">
        <title>ReceptenRadar | Recepten </title>
    </head>

    <body>
        <div th:replace="~{fragments/general :: navbar}"></div>

        <div class="container">
            <h1>Overzicht</h1>

            <div class="recipe-card-display row">
                <div th:each="recipe : ${allRecipes}" class="col-3 mb-4">
                    <div class=" card text-center" style="width: 18rem; height: 20rem">
                        <div class="card-body">
                            <p th:text="${recipe.recipeName}"></p>
                            <img th:src="${recipe.imageUrl}" alt="" width="120" height="100">
                            <p><i class="bi bi-clock"></i><span th:text="${recipe.preparationTime}"></span> Min.</p>
                            <p><i class="bi bi-people-fill"></i><span th:text="${recipe.forAmountOfPeople}"></span></p>
                            <p><i class="bi bi-fire"></i><span th:text="${recipe.calories}"></span></p>
                            <a th:href="@{/recipe/detail/{recipeName}(recipeName=${recipe.recipeName})}" class="overlay-button">Meer info</a>
                        </div>
                    </div>
                </div>
            </div>

            <a th:href="@{/recipe/add}" class="btn btn-primary">Nieuw recept</a>
        </div>

        <div th:replace="~{fragments/general :: footer}"></div>

        <div th:replace="~{fragments/general :: bottomScripts}"></div>
    </body>

</html>
