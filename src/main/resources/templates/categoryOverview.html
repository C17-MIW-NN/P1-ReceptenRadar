<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

    <head th:replace="~{fragments/general :: baseheader(~{:: title})}">
        <title>Categorieën</title>
    </head>

    <body>
        <div th:replace="~{fragments/general :: navbar}"></div>

        <div class="container">

            <h1 class="header-categorie-ingredient">Overzicht van alle categorieën</h1>

            <div>
                <div class="categoryOverview">
                    <div th:each="category : ${allCategories}" class="category-container">
                        <a class="category category-name">
                            <span th:text="${category.categoryName}"></span>
                        </a>
                        <a th:href="@{/category/edit/{name}(name = ${category.categoryName})}"
                           class="btn category category-edit-link">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                    </div>
                </div>

                <a th:href="@{/category/add}" class="btn category category-btn">Nieuwe categorie</a>
            </div>



        </div>

        <div th:replace="~{fragments/general :: footer}"></div>

        <div th:replace="~{fragments/general :: bottomScripts}"></div>
    </body>

</html>
