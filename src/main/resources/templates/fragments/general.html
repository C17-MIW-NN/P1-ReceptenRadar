<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">

    <head th:fragment="baseheader(title)">
        <meta charset="UTF-8">
        <title th:replace="${title}">Receptenradar</title>

        <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" >
        <link rel="stylesheet" th:href="@{/css/receptenradar.css}">
        <link rel="stylesheet" th:href="@{/css/InputTypes.css}">
        <link rel="stylesheet" th:href="@{/css/Navbar.css}">
        <link rel="stylesheet" th:href="@{/css/ContainerStyling.css}">
        <link rel="stylesheet" th:href="@{/css/Modal.css}">
        <link rel="stylesheet" th:href="@{/css/RecipeOverviewCard.css}">
        <link rel="stylesheet" th:href="@{/css/RecipeDetail.css}">
        <link rel="stylesheet" th:href="@{/css/RecipeOverviewHeader.css}">
        <link rel="stylesheet" th:href="@{/css/Categorie-Ingredient-Overview.css}">
        <link rel="stylesheet" th:href="@{/css/RecipeOverview.css}">

    </head>

    <body>
        <div th:fragment="navbar" class="navbar customNavbar">
            <div class="container">
                <a class="navbarLogo" href="/">
                    <img src="/images/logoReceptenRadar.png" alt="Recepten Radar" height="64" >
                </a>

                <ul class="nav">
                    <li class="nav-item">
                        <a class="navLink" th:href="@{/recipe/all}">Recepten</a>
                    </li>
                    <li class="nav-item">
                        <a class="navLink" th:href="@{/ingredient/all}">Ingrediënten</a>
                    </li>
                    <li class="nav-item">
                        <a class="navLink" th:href="@{/category/all}">Categorieën</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="loginButton" th:href="@{/login}">Inloggen</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="loginButton" th:href="@{/logout}">Uitloggen</a>
                    </li>
                </ul>
            </div>
        </div>

        <div th:fragment="recipeDetailCard" class="recipeOverviewCard recipeDetailCard">
                <div class="recipeDetailContainer" >
                    <div class="recipeName typeOverview">
                            <h1>
                                <span th:text="${recipe.recipeName}"></span>&nbsp;
                            </h1>
                        <div class="type-container">
                            <a class="btn type type-edit-link">
                                <i id="openEditModalButton" class="bi bi-pencil"></i>
                            </a>

                            <a class="btn type type-edit-link"
                               th:href="@{'/recipe/detail/' + ${recipe.recipeName} + '/copy'}">
                                <i class="bi bi-copy"></i>
                            </a>
                            <form th:action="@{/recipe/{recipeId}/like(recipeId=${recipe.recipeId})}" method="post">
                                <button type="submit" class="btn type type-edit-link">
                                    <i class="bi bi-hand-thumbs-up"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                    <div class="recipePicture">
                        <div class="image-wrapper">
                            <img th:if="${#strings.isEmpty(recipe.imageUrl)}"
                                 th:src="@{/images/placeholder-image.png}" class="img-fluid rounded"
                                 alt="Geen afbeelding beschikbaar"
                            />
                            <img th:unless="${#strings.isEmpty(recipe.imageUrl)}"
                                 th:src="${recipe.imageUrl}" class="img-fluid rounded"
                                 alt="Afbeelding van het recept"
                            />
                        </div>

                    </div>
                    <div class="recipeMetadata">
                        <div class="recipeOverviewCard-Info recipeDetailInfo">
                            <p>
                                <i class="bi bi-clock"></i>&nbsp;
                                <span th:text="${recipe.preparationTime}"></span> Min.
                            </p>
                            <p>
                                <i class="bi bi-people-fill"></i>&nbsp;
                                <span th:text="${recipe.forAmountOfPeople}"></span>
                            </p>
                            <p>
                                <i class="bi bi-fire"></i>&nbsp;
                                <span th:text="${recipe.calories}"></span>
                            </p>
                            <p>
                                <i class="bi bi-hand-thumbs-up"></i>
                                <span th:text="${recipe.recipeLikes.size()}"></span>
                            </p>
                        </div>

                        <div class="typeOverview">
                            <div th:each="category : ${recipe.categories}" class="type-container"
                                 th:href="@{/category/edit/{name}(name=${category.categoryName})}">
                                <a class="type type-name">
                                    <span th:text="${category.categoryName}"></span>
                                </a>
                            </div>
                        </div>
                        <div th:text="${recipe.recipeDescription}" class="recipeDescription"></div>
                    </div>

                    <div class="recipeIngredients">
                        <h3>Ingrediënten:</h3>
                        <table class="ingredientsTable">
                            <tr th:each="ingredient : ${recipe.recipeIngredients}">
                                <td th:text="${ingredient.getQuantity()} + '&nbsp;' + ${ingredient.getUnit()}"></td>
                                <td th:text="${ingredient.getIngredient().getIngredientName()}"></td>
                            </tr>
                        </table>
                    </div>

                    <div class="recipeDirections">
                        <h3>Stappenplan:</h3>

                        <ol class="fancy-steps">
                            <li th:each="direction : ${recipe.directions}"
                                th:text="${direction.direction}">
                                Step description here
                            </li>
                        </ol>
                    </div>
                </div>
        </div>

        <div th:fragment="addRecipeCard" class="card">
            <div class="addRecipeContent">
                <i id="openAddModalButton" class="bi bi-plus-square-fill"></i>
            </div>
        </div>

        <div th:fragment="addRecipeModal">
            <div id="addRecipeModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h1>Voeg een nieuw recept toe.</h1>
                    <div th:replace="~{fragments/general :: recipeForm}"></div>
                </div>
            </div>
        </div>

        <div th:fragment="editRecipeModal">
            <div id="editRecipeModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <div th:replace="~{fragments/general :: recipeForm}"></div>
                </div>
            </div>
        </div>

        <div th:fragment="recipeOverviewCard" class="card">
            <div class="image-wrapper">
                <a th:href="@{/recipe/detail/{recipeName}(recipeName=${recipe.recipeName})}">

                    <img th:if="${#strings.isEmpty(recipe.imageUrl)}"
                         th:src="@{/images/placeholder-image.png}"
                         alt="Geen afbeelding beschikbaar"
                    />
                    <img th:unless="${#strings.isEmpty(recipe.imageUrl)}"
                         th:src="${recipe.imageUrl}"
                         alt="Afbeelding van het recept"
                    />
                </a>
            </div>

            <div class="recipeOverviewCard-Info">
                <p><i class="bi bi-clock-fill"></i> <span th:text="${recipe.preparationTime}"></span> Min.</p>
                <p><i class="bi bi-people-fill"></i> <span th:text="${recipe.forAmountOfPeople}"></span></p>
                <p><i class="bi bi-fire"></i> <span th:text="${recipe.calories}"></span></p>

                <p><i th:class="${user != null and user.likedRecipes.contains(recipe)} ?
                'bi bi-hand-thumbs-up-fill' : 'bi bi-hand-thumbs-up'"></i>
                    <span th:text="${recipe.recipeLikes.size()}"></span>
                </p>

            </div>

            <h2 class="card-title"><span th:text="${recipe.recipeName}"></span></h2>

            <div class="recipeOverviewCard-Categories">
                <a th:each="category : ${recipe.categories}"
                   th:href="@{/category/edit/{name}(name=${category.categoryName})}"
                   class="category-link">
                    <span th:text="${category.categoryName}"></span>
                </a>
            </div>
        </div>

        <div th:fragment="recipeForm">
            <form class="modal-editRecipeForm"
                  th:action="@{/recipe/save}"
                  th:object="${recipe}" method="post">

                <div class="recipeFormInfoContainer">
                    <input type="hidden" th:field="*{recipeId}" />

                    <label for="recipeName">Naam van het recept:</label>
                    <input type="text" th:field="*{recipeName}" id="recipeName" />

                    <label for="preparationTime">Bereidingstijd (in minuten):</label>
                    <input type="number" th:field="*{preparationTime}" id="preparationTime" />

                    <label for="forAmountOfPeople">Aantal personen:</label>
                    <input type="number" th:field="*{forAmountOfPeople}" id="forAmountOfPeople" />

                    <label for="calories">Calorieën:</label>
                    <input type="number" th:field="*{calories}" id="calories" />

                    <label for="imageUrl">Afbeeldings-URL:</label>
                    <input type="text" th:field="*{imageUrl}" id="imageUrl" />

                    <label>Categorieën:</label>
                    <div class="category-checkboxes">
                        <div th:each="category : ${allCategories}">
                            <label>
                                <input type="checkbox"
                                       th:value="${category.categoryId}"
                                       th:field="*{categories}" />
                                <span th:text="${category.categoryName}"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="recipeFormIngredientsContainer">

                    <label for="recipeDescription">Beschrijving:</label>
                    <textarea th:field="*{recipeDescription}" id="recipeDescription"></textarea>

                    <label>Ingrediënten:</label>
                    <div class="ingredients-container" id="ingredient-container">
                        <div class="ingredient-row" th:each="recipeIngredient, iter : *{recipeIngredients}">
                            <label class="ingredient-label">Ingrediënt [[${iter.index} + 1]]:</label>

                            <select th:field="*{recipeIngredients[__${iter.index}__].ingredient.ingredientId}">
                                <option th:each="ingredient : ${allIngredients}"
                                        th:value="${ingredient.ingredientId}"
                                        th:text="${ingredient.ingredientName}">
                                </option>
                            </select>

                            <!-- Quantity -->
                            <input type="number" step="0.1"
                                   th:field="*{recipeIngredients[__${iter.index}__].quantity}"
                                   placeholder="Hoeveelheid"/>

                            <!-- Unit -->
                            <input type="text"
                                   th:field="*{recipeIngredients[__${iter.index}__].unit}"
                                   placeholder="Eenheid (bijv. gram, ml)"/>

                            <button type="button" class="remove-ingredient-btn">Wissen</button>
                        </div>
                    </div>

                    <div class="add-ingredient-button">
                        <button type="button" id="add-ingredient-btn">Voeg ingrediënt toe</button>
                    </div>

                    <label>Stappenplan:</label>
                    <div class="directions-container" id="step-container">
                        <div class="step-row" th:each="direction, iter : *{directions}">
                            <label class="step-label">Stap [[${iter.index} + 1]]:</label>
                            <input type="text" th:field="*{directions[__${iter.index}__].direction}"/>
                            <button type="button" class="remove-step-btn">Wissen</button>
                        </div>
                    </div>

                    <div class="add-step-button">
                        <button type="button" id="add-step-btn">Voeg stap toe</button>
                    </div>


                    <div class="saveAndDeleteButtons">
                        <button id="saveButton" type="submit" th:formaction="@{/recipe/save}">Opslaan</button>
                        <button id="deleteButton" type="submit"
                                th:formaction="@{/recipe/delete/{recipeId}(recipeId=${recipe.recipeId})}"
                                th:if="${recipe.recipeId != null}">Verwijderen</button>
                    </div>
                </div>
            </form>
        </div>

        <div th:fragment="footer" class="footer">
            <footer><p class="text-center text text-muted">Copyright Team Bril-jant &copy;2025</p></footer>
        </div>

        <div th:fragment="bottomScripts">
            <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
            <script th:src="@{/js/modalHandler.js}"></script>
            <script th:src="@{/js/DirectionsScript.js}"></script>
            <script th:src="@{/js/IngredientScript.js}"></script>
            <script th:inline="javascript"> const allIngredients = [[${allIngredients}]]; </script>
        </div>
    </body>

</html>
