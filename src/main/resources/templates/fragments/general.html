<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">

    <head th:fragment="baseheader(title)">
        <meta charset="UTF-8">
        <title th:replace="${title}">Receptenradar</title>

        <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" >
        <link rel="stylesheet" th:href="@{/css/receptenradar.css}">
    </head>

    <body>
        <div th:fragment="navbar" class="navbar customNavbar">
            <div class="container">
                <a class="navbar-logo" href="/">
                    <img src="/images/logoReceptenRadar.png" alt="Recepten Radar" height="64" >
                </a>

                <ul class="nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recipe/all}">Recepten</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/ingredient/all}">Ingrediënten</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/category/all}">Categorieën</a>
                    </li>
                </ul>
            </div>
        </div>

        <div th:fragment="footer" class="footer">
            <footer><p class="text-center text text-muted">Copyright Team Bril-jant &copy;2025</p></footer>
        </div>

        <div th:fragment="bottomScripts">
            <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        </div>

        <div th:fragment="recipeDetailCard">
            <div class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-4">
                        <img th:src="${recipe.imageUrl}" class="img-fluid rounded-start" alt="Image not found">
                    </div>

                    <div class="col-md-8">
                        <div class="card-body">
                            <h1 class="card-title"><span th:text="${recipe.recipeName}"></span></h1>

                            <p><i class="bi bi-clock"></i><span th:text="${recipe.preparationTime}"></span> Min.</p>
                            <p><i class="bi bi-people-fill"></i><span th:text="${recipe.forAmountOfPeople}"></span></p>
                            <p><i class="bi bi-fire"></i><span th:text="${recipe.calories}"></span></p>

                            <p>Categorieën</p>
                                <ul>
                                    <li th:each="category : ${recipe.categories}" th:text="${category.categoryName}"></li>
                                </ul>

                            <a th:href="@{/recipe/edit/{recipeName}(recipeName=${recipe.recipeName})}">Pas aan</a>
                            <a th:href="@{/directions}">Pas stappenplan aan</a>


                        </div>
                    </div>

                </div>
            </div>
        </div>

    <div th:fragment="recipeOverviewCard">
        <div class = "recipeOverviewCard">

            <div class="image-wrapper">
                <a th:href="@{/recipe/detail/{recipeName}(recipeName=${recipe.recipeName})}">
                    <img th:src="${recipe.imageUrl}" alt="Image not found">
                </a>
            </div>

            <Div class="recipeOverviewCardInfo">
                <p><i class="bi bi-clock"></i> <span th:text="${recipe.preparationTime}"></span> Min.</p>
                <p><i class="bi bi-people-fill"></i> <span th:text="${recipe.forAmountOfPeople}"></span></p>
                <p><i class="bi bi-fire"></i> <span th:text="${recipe.calories}"></span></p></div>

            <h2 class="card-title"><span th:text="${recipe.recipeName}"></span></h2>


        </div>
    </div>



    </body>



</html>
