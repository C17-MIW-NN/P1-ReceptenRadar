<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

    <head th:replace="~{fragments/general :: baseheader(~{:: title})}">
        <title>ReceptenRadar | Nieuw Ingrediënt</title>
    </head>

    <body>
        <div th:replace="~{fragments/general :: navbar}"></div>

        <div class="container">
            <h1>Voeg een nieuw ingrediënt toe</h1>

            <form th:action="@{/ingredient/save}" th:object="${formIngredient}" method="post">
                <label for="ingredientName">Welk ingrediënt wil je toevoegen?:</label>
                <input type="text" th:field="*{ingredientName}" id="ingredientName">
                <input type="submit" value="Opslaan">
            </form>
        </div>

        <div th:replace="~{fragments/general :: footer}"></div>

        <div th:replace="~{fragments/general :: bottomScripts}"></div>
    </body>

</html>
