<!DOCTYPE html>

<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add recipe</title>

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">

</head>

<body>

<div th:replace="~{fragments/general :: navbar}"></div>

<div class="container">
    <h1>Add a new recipe</h1>

    <form th:action="@{/recipe/save}" th:object="${formRecipe}" method="post">
        <label for="recipeName">Recipe name:</label>
        <input type="text" th:field="*{recipeName}" id="recipeName">
        <input type="submit" value="Save">
    </form>
</div>

<div th:replace="~{fragments/general :: footer}"></div>
<div th:replace="~{fragments/general :: bottomScripts}"></div>
</body>


</html>
